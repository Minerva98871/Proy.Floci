# La clave de RDS no va en el ConfigMap: es un Secret, para que quede separado
# de la configuracion y se pueda montar con permisos distintos.
#
# En un despliegue real este Secret lo gestionaria AWS Secrets Manager con
# cifrado KMS y los Pods lo leerian con IRSA o Pod Identity, sin que la clave
# estuviera en texto plano en el manifiesto.
apiVersion: v1
kind: Secret
metadata:
  name: lomax-secrets
  namespace: lomax
  labels:
    app.kubernetes.io/part-of: lomax-sa
type: Opaque
stringData:
  RDS_PASSWORD: "LomaxLocal2026!"
